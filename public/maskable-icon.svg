<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid background fills the maskable safe-zone -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- Barbell scaled inside the 80% safe zone (51px padding each side) -->
  <g fill="#c8ff00" transform="translate(51 51) scale(0.8)">
    <rect x="80" y="244" width="352" height="24" rx="4"/>
    <rect x="100" y="180" width="44" height="152" rx="8"/>
    <rect x="50" y="200" width="36" height="112" rx="6"/>
    <rect x="368" y="180" width="44" height="152" rx="8"/>
    <rect x="426" y="200" width="36" height="112" rx="6"/>
  </g>
</svg>
